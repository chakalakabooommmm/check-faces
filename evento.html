<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria do Evento</title>
  
  <!-- Face-API.js e JSZip -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #18181b;
      color: #f4f4f5;
      padding: 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      text-align: center;
      position: relative;
    }
    
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 15px;
      padding: 8px 16px;
      border-radius: 8px;
      background: #27272a;
      transition: all 0.2s;
    }

    .btn-back:hover {
      color: #fff;
      background: #3f3f46;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .event-meta {
      color: #f87171;
      font-size: 0.95rem;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary { background-color: #dc2626; color: #fff; }
    .btn-primary:hover { background-color: #b91c1c; }

    .btn-secondary { 
      background-color: #27272a; 
      color: #f4f4f5; 
      border: 1px solid #3f3f46;
    }
    .btn-secondary:hover { background-color: #3f3f46; }

    .btn-success { background-color: #059669; color: #fff; }
    .btn-success:hover { background-color: #047857; }

    #statusMessage {
      font-size: 0.95rem;
      color: #a1a1aa;
      min-height: 24px;
    }

    /* Abas */
    .tabs-wrapper {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      border-bottom: 1px solid #27272a;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .tabs-bar {
      display: flex;
      gap: 10px;
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn:hover { color: #f4f4f5; background-color: #27272a; }
    .tab-btn.active { color: #fff; background-color: #dc2626; }
    .tab-btn.tab-matched { background-color: #059669; color: #fff; }

    /* Grid da Galeria */
    .gallery-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      background-color: #27272a;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img { transform: scale(1.06); }

    .folder-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(4px);
      color: #e4e4e7;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #71717a;
      font-size: 1.1rem;
    }

    #scrollLoader {
      max-width: 1200px;
      margin: 30px auto;
      text-align: center;
      color: #a1a1aa;
      font-size: 0.95rem;
      display: none;
    }

    /* 3 COLUNAS NO CELULAR */
    @media (max-width: 600px) {
      body { padding: 10px 6px; }
      .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
      .gallery-item { border-radius: 6px; }
      .folder-badge { font-size: 0.6rem; padding: 2px 4px; bottom: 3px; left: 3px; }
      h1 { font-size: 1.5rem; }
      .btn { padding: 10px 16px; font-size: 0.9rem; }
    }

    /* MODAL DA CÂMERA BIOMÉTRICA (ESTILO FACE ID) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 20px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* Indicador dos 3 Passos */
    .scan-steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0 10px 0;
    }

    .step-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      background: #18181b;
      color: #71717a;
      border: 1px solid #3f3f46;
      transition: all 0.3s;
    }

    .step-pill.active {
      background: #dc2626;
      color: #fff;
      border-color: #ef4444;
      transform: scale(1.05);
    }

    .step-pill.completed {
      background: #059669;
      color: #fff;
      border-color: #10b981;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      margin: 12px 0 16px 0;
      border: 2px solid #3f3f46;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Círculo Guia Inteligente */
    .face-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 220px;
      border: 3px dashed #ef4444;
      border-radius: 50%;
      pointer-events: none;
      transition: border-color 0.25s, transform 0.25s;
    }

    .face-guide.aligned {
      border-color: #10b981;
      border-style: solid;
      transform: translate(-50%, -50%) scale(1.03);
    }

    /* Feedback de Instrução */
    .scan-instruction {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      min-height: 28px;
      margin-bottom: 6px;
    }

    .scan-hint {
      font-size: 0.82rem;
      color: #a1a1aa;
      margin-bottom: 12px;
    }

    /* Lightbox */
    .lightbox-content {
      max-width: 85vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
    }

    .lightbox-actions {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .photo-counter { color: #a1a1aa; font-size: 0.95rem; }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(39, 39, 42, 0.8);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 2rem;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      z-index: 1010;
      transition: all 0.2s;
    }

    .nav-btn:hover { background: #dc2626; transform: translateY(-50%) scale(1.1); }
    .nav-btn-prev { left: 25px; }
    .nav-btn-next { right: 25px; }

    .btn-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(39, 39, 42, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1015;
    }

    .btn-close:hover { background: #b91c1c; }

    @media (max-width: 600px) {
      .nav-btn { width: 42px; height: 42px; font-size: 1.4rem; }
      .nav-btn-prev { left: 8px; }
      .nav-btn-next { right: 8px; }
      .btn-close { top: 10px; right: 10px; width: 36px; height: 36px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="./index.html" class="btn-back">← Voltar para Todos os Eventos</a>
    <h1 id="eventTitle">Carregando Evento...</h1>
    <p class="event-meta" id="eventDate"></p>

    <div class="controls">
      <button class="btn btn-primary" id="btnScanFace" disabled>
        📷 Escanear meu Rosto (3 Ângulos)
      </button>
      <button class="btn btn-secondary" id="btnResetFilter" style="display: none;">
        Mostrar Todas as Fotos
      </button>
      <button class="btn btn-success" id="btnDownloadAllMatched" style="display: none;">
        📦 Baixar Todas as Minhas Fotos (.zip)
      </button>
    </div>
    <p id="statusMessage">Conectando ao Google Drive...</p>
  </header>

  <!-- Abas Dinâmicas -->
  <div class="tabs-wrapper">
    <div class="tabs-bar" id="tabsBar"></div>
  </div>

  <main class="gallery-grid" id="galleryGrid"></main>
  <div id="scrollLoader">Carregando mais fotos...</div>

  <!-- MODAL DE ESCANEAMENTO AUTOMÁTICO 3D / MULTI-ÂNGULO -->
  <div class="modal-overlay" id="cameraModal">
    <div class="modal-content">
      <button class="btn-close" id="btnCloseCamera">&times;</button>
      
      <div class="scan-instruction" id="scanInstruction">Alinhe seu rosto</div>
      <div class="scan-hint" id="scanHint">Posicione o rosto dentro da marcação</div>

      <!-- Indicadores dos 3 Passos -->
      <div class="scan-steps">
        <span class="step-pill active" id="pillFront">1. Frente</span>
        <span class="step-pill" id="pillLeft">2. Esquerda</span>
        <span class="step-pill" id="pillRight">3. Direita</span>
      </div>

      <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="face-guide" id="faceGuide"></div>
      </div>

      <p style="font-size: 0.78rem; color: #71717a;">
        A captura é 100% automática quando a posição correta for detectada.
      </p>
    </div>
  </div>

  <!-- Modal Lightbox -->
  <div class="modal-overlay" id="lightboxModal">
    <button class="btn-close" id="btnCloseLightbox">&times;</button>
    <button class="nav-btn nav-btn-prev" id="btnPrevPhoto">&#10094;</button>
    <div class="lightbox-content">
      <img id="lightboxImg" class="lightbox-img" src="" alt="Foto expandida">
      <div class="lightbox-actions">
        <a id="btnDownload" class="btn btn-primary" href="" target="_blank" download>⬇ Baixar em Alta Resolução</a>
        <span class="photo-counter" id="photoCounter"></span>
      </div>
    </div>
    <button class="nav-btn nav-btn-next" id="btnNextPhoto">&#10095;</button>
  </div>

  <script src="./eventos.js?v=novo"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');
    const eventoAtual = EVENTOS.find(e => e.id === eventId) || EVENTOS[0];

    document.getElementById('eventTitle').textContent = eventoAtual.nome;
    document.getElementById('eventDate').textContent = eventoAtual.data;
    document.title = `${eventoAtual.nome} - Galeria`;

    /* ESTADO DA APLICAÇÃO */
    let FOLDERS = [];
    const BATCH_SIZE = 30;
    let renderedCount = 0;
    let allPhotos = [];
    let currentFilteredPhotos = [];
    let currentPhotoIndex = 0;
    const galleryDescriptors = new Map();
    let activeTabId = '';
    let matchedPhotoIds = null;
    let stream = null;
    let isScanningActive = false;

    const tabsBar = document.getElementById('tabsBar');
    const galleryGrid = document.getElementById('galleryGrid');
    const scrollLoader = document.getElementById('scrollLoader');
    const statusMessage = document.getElementById('statusMessage');
    const btnScanFace = document.getElementById('btnScanFace');
    const btnResetFilter = document.getElementById('btnResetFilter');
    const btnDownloadAllMatched = document.getElementById('btnDownloadAllMatched');

    // Câmera & Scanner
    const cameraModal = document.getElementById('cameraModal');
    const webcam = document.getElementById('webcam');
    const btnCloseCamera = document.getElementById('btnCloseCamera');
    const faceGuide = document.getElementById('faceGuide');
    const scanInstruction = document.getElementById('scanInstruction');
    const scanHint = document.getElementById('scanHint');
    const pillFront = document.getElementById('pillFront');
    const pillLeft = document.getElementById('pillLeft');
    const pillRight = document.getElementById('pillRight');

    // Lightbox
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const btnCloseLightbox = document.getElementById('btnCloseLightbox');
    const btnDownload = document.getElementById('btnDownload');
    const btnPrevPhoto = document.getElementById('btnPrevPhoto');
    const btnNextPhoto = document.getElementById('btnNextPhoto');
    const photoCounter = document.getElementById('photoCounter');

    // 1. Descobrir subpastas dinamicamente
    async function loadEventGallery() {
      statusMessage.textContent = 'Identificando galerias no Google Drive...';

      try {
        const queryPastas = encodeURIComponent(`'${eventoAtual.folderId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
        const urlPastas = `https://www.googleapis.com/drive/v3/files?q=${queryPastas}&fields=files(id,name)&key=${GOOGLE_API_KEY}`;
        
        const resPastas = await fetch(urlPastas);
        const dataPastas = await resPastas.json();
        let subpastas = dataPastas.files || [];

        if (subpastas.length === 0) {
          subpastas = [{ id: eventoAtual.folderId, name: 'Todas as Fotos' }];
        }

        allPhotos = [];
        for (const pasta of subpastas) {
          statusMessage.textContent = `Carregando galeria: ${pasta.name}...`;
          const fotosDaPasta = await fetchPhotosFromSubfolder(pasta.id, pasta.name);
          allPhotos.push(...fotosDaPasta);
        }

        if (allPhotos.length === 0) {
          statusMessage.textContent = 'Nenhuma foto encontrada nas pastas deste evento.';
          return false;
        }

        FOLDERS = subpastas;
        activeTabId = FOLDERS[0].id;

        renderTabs();
        setupGalleryView();
        return true;
      } catch (err) {
        console.error(err);
        statusMessage.textContent = 'Erro ao carregar fotos do Drive.';
        return false;
      }
    }

    async function fetchPhotosFromSubfolder(folderId, folderName) {
      const query = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'image/' and trashed = false`);
      let allFiles = [];
      let pageToken = '';

      try {
        do {
          const pageParam = pageToken ? `&pageToken=${pageToken}` : '';
          const url = `https://www.googleapis.com/drive/v3/files?q=${query}&pageSize=1000&fields=nextPageToken,files(id,name)&key=${GOOGLE_API_KEY}${pageParam}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.files) allFiles.push(...data.files);
          pageToken = data.nextPageToken;
        } while (pageToken);

        return allFiles.map(file => ({
          id: file.id,
          name: file.name,
          folderId: folderId,
          folderName: folderName,
          thumbUrl: `https://lh3.googleusercontent.com/d/${file.id}=w400`,
          fullUrl: `https://lh3.googleusercontent.com/d/${file.id}=s0`,
          downloadUrl: `https://drive.google.com/uc?export=download&id=${file.id}`
        }));
      } catch (e) {
        return [];
      }
    }

    // 2. Abas e Renderização
    function renderTabs() {
      tabsBar.innerHTML = '';
      if (matchedPhotoIds !== null) {
        const matchedBtn = document.createElement('button');
        matchedBtn.className = `tab-btn tab-matched ${activeTabId === 'matched' ? 'active' : ''}`;
        matchedBtn.innerHTML = `✨ Suas Fotos (${matchedPhotoIds.size})`;
        matchedBtn.onclick = () => { activeTabId = 'matched'; renderTabs(); setupGalleryView(); };
        tabsBar.appendChild(matchedBtn);
      }

      FOLDERS.forEach(folder => {
        const total = allPhotos.filter(p => {
          const inFolder = p.folderId === folder.id;
          return matchedPhotoIds ? (inFolder && matchedPhotoIds.has(p.id)) : inFolder;
        }).length;

        const btn = document.createElement('button');
        btn.className = `tab-btn ${activeTabId === folder.id ? 'active' : ''}`;
        btn.innerHTML = `${folder.name} <span>(${total})</span>`;
        btn.onclick = () => { activeTabId = folder.id; renderTabs(); setupGalleryView(); };
        tabsBar.appendChild(btn);
      });
    }

    function setupGalleryView() {
      galleryGrid.innerHTML = '';
      renderedCount = 0;

      if (activeTabId === 'matched') {
        currentFilteredPhotos = allPhotos.filter(p => matchedPhotoIds.has(p.id));
      } else {
        currentFilteredPhotos = allPhotos.filter(p => {
          const match = p.folderId === activeTabId;
          return matchedPhotoIds ? (match && matchedPhotoIds.has(p.id)) : match;
        });
      }

      if (currentFilteredPhotos.length === 0) {
        galleryGrid.innerHTML = '<div class="empty-message">Nenhuma foto para exibir nesta aba.</div>';
        scrollLoader.style.display = 'none';
        return;
      }
      renderNextBatch();
    }

    function renderNextBatch() {
      if (renderedCount >= currentFilteredPhotos.length) {
        scrollLoader.style.display = 'none';
        return;
      }
      const nextBatch = currentFilteredPhotos.slice(renderedCount, renderedCount + BATCH_SIZE);
      nextBatch.forEach((photo, i) => {
        const globalIndex = renderedCount + i;
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `
          <img src="${photo.thumbUrl}" alt="${photo.name}" loading="lazy">
          ${activeTabId === 'matched' ? `<span class="folder-badge">${photo.folderName}</span>` : ''}
        `;
        item.onclick = () => openLightbox(globalIndex);
        galleryGrid.appendChild(item);
      });

      renderedCount += nextBatch.length;
      scrollLoader.style.display = renderedCount < currentFilteredPhotos.length ? 'block' : 'none';
    }

    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) {
        renderNextBatch();
      }
    });

    // 3. Lightbox
    function openLightbox(index) {
      currentPhotoIndex = index;
      updateLightboxDisplay();
      lightboxModal.style.display = 'flex';
    }

    function updateLightboxDisplay() {
      if (currentFilteredPhotos.length === 0) return;
      const photo = currentFilteredPhotos[currentPhotoIndex];
      lightboxImg.src = photo.fullUrl;
      btnDownload.href = photo.downloadUrl;
      photoCounter.textContent = `${currentPhotoIndex + 1} de ${currentFilteredPhotos.length}`;
    }

    btnNextPhoto.onclick = (e) => { e.stopPropagation(); currentPhotoIndex = (currentPhotoIndex + 1) % currentFilteredPhotos.length; updateLightboxDisplay(); };
    btnPrevPhoto.onclick = (e) => { e.stopPropagation(); currentPhotoIndex = (currentPhotoIndex - 1 + currentFilteredPhotos.length) % currentFilteredPhotos.length; updateLightboxDisplay(); };
    btnCloseLightbox.onclick = () => { lightboxModal.style.display = 'none'; lightboxImg.src = ''; };

    window.addEventListener('keydown', (e) => {
      if (lightboxModal.style.display === 'flex') {
        if (e.key === 'ArrowRight') btnNextPhoto.click();
        if (e.key === 'ArrowLeft') btnPrevPhoto.click();
        if (e.key === 'Escape') btnCloseLightbox.click();
      }
    });

    // 4. Carregar IA
    async function initFaceAPI() {
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
      try {
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);

        const res = await fetch('./faces.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const precomputedFaces = await res.json();
          for (const [photoId, descriptors] of Object.entries(precomputedFaces)) {
            galleryDescriptors.set(photoId, descriptors.map(d => new Float32Array(d)));
          }
        }

        statusMessage.textContent = 'Pronto! Você pode ver as fotos ou escanear seu rosto.';
        btnScanFace.disabled = false;
      } catch (err) {
        statusMessage.textContent = 'Pronto! Galeria carregada.';
        btnScanFace.disabled = false;
      }
    }

    // 5. CÂMERA BIOMÉTRICA AUTOMÁTICA EM 3 ETAPAS (Frente, Esquerda, Direita)
    btnScanFace.onclick = async () => {
      cameraModal.style.display = 'flex';
      resetPills();

      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
        });
        webcam.srcObject = stream;
        isScanningActive = true;
        
        // Aguarda a câmera estabilizar e inicia o loop inteligente
        webcam.onloadedmetadata = () => {
          startBiometricCaptureSequence();
        };
      } catch (err) {
        alert('Permissão de câmera negada.');
        cameraModal.style.display = 'none';
      }
    };

    function closeCamera() {
      isScanningActive = false;
      cameraModal.style.display = 'none';
      if (stream) stream.getTracks().forEach(t => t.stop());
    }

    btnCloseCamera.onclick = closeCamera;

    function resetPills() {
      pillFront.className = 'step-pill active';
      pillLeft.className = 'step-pill';
      pillRight.className = 'step-pill';
      faceGuide.className = 'face-guide';
    }

    // Função que calcula a rotação horizontal da cabeça (Yaw) usando os 68 marcos faciais
    function calculateHeadYaw(landmarks) {
      const noseTip = landmarks.positions[30];
      const leftJaw = landmarks.positions[0];   // Lateral esquerda no vídeo
      const rightJaw = landmarks.positions[16]; // Lateral direita no vídeo

      const distLeft = noseTip.x - leftJaw.x;
      const distRight = rightJaw.x - noseTip.x;

      // Retorna valor entre -1 e +1 (0 = perfeitamente de frente)
      return (distLeft - distRight) / (distLeft + distRight);
    }

    async function startBiometricCaptureSequence() {
      const capturedDescriptors = [];
      let currentStage = 'FRONT'; // 'FRONT' -> 'LEFT' -> 'RIGHT' -> 'DONE'
      let holdFrameCount = 0;

      scanInstruction.textContent = "1. Olhe de frente";
      scanHint.textContent = "Centralize o rosto no círculo";

      while (isScanningActive && currentStage !== 'DONE') {
        const detection = await faceapi.detectSingleFace(
          webcam, 
          new faceapi.SsdMobilenetv1Options({ minConfidence: 0.4 })
        ).withFaceLandmarks().withFaceDescriptor();

        if (detection) {
          const yaw = calculateHeadYaw(detection.landmarks);

          if (currentStage === 'FRONT') {
            // Rosto frontal (tolerância entre -0.15 e +0.15)
            if (Math.abs(yaw) < 0.16) {
              holdFrameCount++;
              faceGuide.className = 'face-guide aligned';

              if (holdFrameCount >= 2) { // Segurou estável
                capturedDescriptors.push(detection.descriptor);
                pillFront.className = 'step-pill completed';
                pillLeft.className = 'step-pill active';
                
                currentStage = 'LEFT';
                holdFrameCount = 0;
                faceGuide.className = 'face-guide';

                scanInstruction.textContent = "2. Vire para a Esquerda";
                scanHint.textContent = "Gire a cabeça suavemente cerca de 30°";
                await new Promise(r => setTimeout(r, 400));
              }
            } else {
              holdFrameCount = 0;
              faceGuide.className = 'face-guide';
            }

          } else if (currentStage === 'LEFT') {
            // Rosto virado para a esquerda (yaw positivo no vídeo espelhado)
            if (yaw > 0.24) {
              holdFrameCount++;
              faceGuide.className = 'face-guide aligned';

              if (holdFrameCount >= 2) {
                capturedDescriptors.push(detection.descriptor);
                pillLeft.className = 'step-pill completed';
                pillRight.className = 'step-pill active';

                currentStage = 'RIGHT';
                holdFrameCount = 0;
                faceGuide.className = 'face-guide';

                scanInstruction.textContent = "3. Vire para a Direita";
                scanHint.textContent = "Agora gire suavemente para o outro lado";
                await new Promise(r => setTimeout(r, 400));
              }
            } else {
              holdFrameCount = 0;
              faceGuide.className = 'face-guide';
            }

          } else if (currentStage === 'RIGHT') {
            // Rosto virado para a direita (yaw negativo no vídeo espelhado)
            if (yaw < -0.24) {
              holdFrameCount++;
              faceGuide.className = 'face-guide aligned';

              if (holdFrameCount >= 2) {
                capturedDescriptors.push(detection.descriptor);
                pillRight.className = 'step-pill completed';
                currentStage = 'DONE';
              }
            } else {
              holdFrameCount = 0;
              faceGuide.className = 'face-guide';
            }
          }

        } else {
          faceGuide.className = 'face-guide';
          holdFrameCount = 0;
        }

        await new Promise(r => setTimeout(r, 100)); // Checagem a cada 100ms
      }

      if (currentStage === 'DONE') {
        scanInstruction.textContent = "✨ 3 Ângulos Capturados!";
        scanHint.textContent = "Cruzando com as fotos da galeria...";
        await new Promise(r => setTimeout(r, 500));
        
        closeCamera();
        processMatchingWithMultiDescriptors(capturedDescriptors);
      }
    }

    // 6. Comparação dos 3 Ângulos com a Galeria
    function processMatchingWithMultiDescriptors(userDescriptors) {
      statusMessage.textContent = 'Comparando seus 3 ângulos faciais com as fotos...';

      const foundIds = new Set();
      // 0.58 com 3 ângulos dá precisão cirúrgica sem falsos positivos
      const DISTANCE_THRESHOLD = 0.48;

      allPhotos.forEach(photo => {
        const photoDescriptors = galleryDescriptors.get(photo.id) || [];
        
        const hasMatch = photoDescriptors.some(photoDesc => {
          return userDescriptors.some(uDesc => {
            return faceapi.euclideanDistance(uDesc, photoDesc) < DISTANCE_THRESHOLD;
          });
        });

        if (hasMatch) foundIds.add(photo.id);
      });

      if (foundIds.size > 0) {
        matchedPhotoIds = foundIds;
        activeTabId = 'matched';
        renderTabs();
        setupGalleryView();
        statusMessage.textContent = `Encontramos ${foundIds.size} foto(s) onde você aparece!`;
        btnResetFilter.style.display = 'inline-block';
        btnDownloadAllMatched.style.display = 'inline-block';
        btnDownloadAllMatched.textContent = `📦 Baixar Todas as Minhas Fotos (${foundIds.size})`;
      } else {
        alert('Não encontramos você nas fotos deste evento. Se estava de óculos nas fotos, tente escanear com os óculos.');
        statusMessage.textContent = 'Nenhuma foto encontrada para este rosto.';
      }
    }

    // 7. Download ZIP
    btnDownloadAllMatched.onclick = async () => {
      if (!matchedPhotoIds || matchedPhotoIds.size === 0) return;
      const photosToDownload = allPhotos.filter(p => matchedPhotoIds.has(p.id));
      btnDownloadAllMatched.disabled = true;

      try {
        const zip = new JSZip();
        let i = 0;
        for (const photo of photosToDownload) {
          i++;
          btnDownloadAllMatched.textContent = `Baixando ${i}/${photosToDownload.length}...`;
          const res = await fetch(photo.fullUrl);
          const blob = await res.blob();
          zip.file(`${photo.folderName}_${photo.name}.jpg`, blob);
        }
        btnDownloadAllMatched.textContent = 'Compactando .zip...';
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = `fotos_${eventoAtual.id}.zip`;
        a.click();
        btnDownloadAllMatched.textContent = '✔ Download Concluído!';
        setTimeout(() => {
          btnDownloadAllMatched.disabled = false;
          btnDownloadAllMatched.textContent = `📦 Baixar Todas as Minhas Fotos (${photosToDownload.length})`;
        }, 3000);
      } catch (e) {
        alert('Erro ao compactar fotos.');
        btnDownloadAllMatched.disabled = false;
      }
    };

    btnResetFilter.onclick = () => {
      matchedPhotoIds = null;
      activeTabId = FOLDERS[0].id;
      btnResetFilter.style.display = 'none';
      btnDownloadAllMatched.style.display = 'none';
      renderTabs();
      setupGalleryView();
      statusMessage.textContent = 'Exibindo todas as fotos.';
    };

    (async () => {
      const ok = await loadEventGallery();
      if (ok) await initFaceAPI();
    })();
  </script>

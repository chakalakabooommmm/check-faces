<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria do Evento</title>
  
  <!-- Face-API.js e JSZip -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #18181b;
      color: #f4f4f5;
      padding: 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      text-align: center;
      position: relative;
    }
    
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 15px;
      padding: 8px 16px;
      border-radius: 8px;
      background: #27272a;
      transition: all 0.2s;
    }

    .btn-back:hover {
      color: #fff;
      background: #3f3f46;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .event-meta {
      color: #f87171;
      font-size: 0.95rem;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary { background-color: #dc2626; color: #fff; }
    .btn-primary:hover { background-color: #b91c1c; }

    .btn-secondary { 
      background-color: #27272a; 
      color: #f4f4f5; 
      border: 1px solid #3f3f46;
    }
    .btn-secondary:hover { background-color: #3f3f46; }

    .btn-success { background-color: #059669; color: #fff; }
    .btn-success:hover { background-color: #047857; }

    #statusMessage {
      font-size: 0.95rem;
      color: #a1a1aa;
      min-height: 24px;
    }

    /* Abas */
    .tabs-wrapper {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      border-bottom: 1px solid #27272a;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .tabs-bar {
      display: flex;
      gap: 10px;
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn:hover { color: #f4f4f5; background-color: #27272a; }
    .tab-btn.active { color: #fff; background-color: #dc2626; }
    .tab-btn.tab-matched { background-color: #059669; color: #fff; }

    /* Grid da Galeria */
    .gallery-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      background-color: #27272a;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img { transform: scale(1.06); }

    .folder-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(4px);
      color: #e4e4e7;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #71717a;
      font-size: 1.1rem;
    }

    #scrollLoader {
      max-width: 1200px;
      margin: 30px auto;
      text-align: center;
      color: #a1a1aa;
      font-size: 0.95rem;
      display: none;
    }

    /* 3 COLUNAS NO CELULAR */
    @media (max-width: 600px) {
      body { padding: 10px 6px; }
      .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
      .gallery-item { border-radius: 6px; }
      .folder-badge { font-size: 0.6rem; padding: 2px 4px; bottom: 3px; left: 3px; }
      h1 { font-size: 1.5rem; }
      .btn { padding: 10px 16px; font-size: 0.9rem; }
    }

    /* MODAL DE CÂMERA BIOMÉTRICA */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 20px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .scan-steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0 10px 0;
      flex-wrap: wrap;
    }

    .step-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      background: #18181b;
      color: #71717a;
      border: 1px solid #3f3f46;
      transition: all 0.3s;
    }

    .step-pill.active {
      background: #dc2626;
      color: #fff;
      border-color: #ef4444;
      transform: scale(1.05);
    }

    .step-pill.completed {
      background: #059669;
      color: #fff;
      border-color: #10b981;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      margin: 12px 0 16px 0;
      border: 2px solid #3

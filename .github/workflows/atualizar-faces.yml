name: Robô Atualizador de Faces (InsightFace)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [drive-upload]

permissions:
  contents: write

concurrency:
  group: sync-faces
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do InsightFace
        run: |
          pip install --upgrade pip
          pip install insightface onnxruntime opencv-python-headless numpy requests

      - name: Rodar Inteligência Artificial
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python sync_faces.py

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "Robô das Fotos"
          git config --global user.email "bot@galeria.com"
          git add faces-*.json
          if ! git diff --staged --quiet; then
            git commit -m "faces atualizadas via InsightFace [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nenhuma mudança nas faces para enviar."
          fi

name: Robô Atualizador de Faces (AWS Rekognition)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [drive-upload]

permissions:
  contents: write

concurrency:
  group: sync-faces
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências Rápidas (Boto3 da AWS)
        run: |
          pip install boto3 requests

      - name: Catalogar Fotos na AWS Rekognition
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python sync_rekognition.py

      - name: Salvar histórico de fotos indexadas
        run: |
          git config --global user.name "Robô AWS"
          git config --global user.email "bot@galeria.com"
          git add indexed.json
          if ! git diff --staged --quiet; then
            git commit -m "histórico AWS atualizado [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nenhuma foto nova indexada para salvar."
          fi

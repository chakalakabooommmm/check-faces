<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Galerias & Eventos</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #18181b; /* Cinza escuro */
      color: #f4f4f5;
      padding: 30px 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 40px auto;
      text-align: center;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: #a1a1aa;
      font-size: 1rem;
      font-weight: 400;
    }

    /* Grid de Eventos */
    .events-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    @media (min-width: 600px) {
      .events-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 900px) {
      .events-grid {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
    }

    /* Card Quadrado do Evento */
    .event-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      background-color: #27272a;
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .event-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .event-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .event-card:hover img {
      transform: scale(1.08);
    }

    .event-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(24, 24, 27, 0.1) 35%, rgba(24, 24, 27, 0.95) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 22px;
    }

    /* Data do evento em Vermelho Claro */
    .event-date {
      color: #f87171;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .event-title {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .event-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #e4e4e7;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      align-self: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background 0.2s, color 0.2s;
    }

    .event-card:hover .event-badge {
      background: #dc2626;
      color: #ffffff;
      border-color: #ef4444;
    }
  </style>
</head>
<body>

  <header>
    <h1>📸 Nossas Galerias</h1>
    <p class="subtitle">Selecione um evento para visualizar as fotos e encontrar o seu rosto</p>
  </header>

  <main class="events-grid" id="eventsGrid"></main>

  <script src="./eventos.js?v=novo"></script>
  <script>
    const eventsGrid = document.getElementById('eventsGrid');

    function renderEvents() {
      eventsGrid.innerHTML = '';

      EVENTOS.forEach(evento => {
        const card = document.createElement('a');
        card.className = 'event-card';
        card.href = `./evento.html?id=${encodeURIComponent(evento.id)}`;

        card.innerHTML = `
          <img src="${evento.capa}" alt="${evento.nome}" loading="lazy">
          <div class="event-overlay">
            <span class="event-date">${evento.data}</span>
            <h2 class="event-title">${evento.nome}</h2>
            <span class="event-badge">📁 Acessar Galeria</span>
          </div>
        `;

        eventsGrid.appendChild(card);
      });
    }

    renderEvents();
  </script>
</body>
</html>

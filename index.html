<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Galerias & Eventos</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 30px 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 40px auto;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1.05rem;
    }

    /* Grid de Eventos */
    .events-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Card Quadrado do Evento */
    .event-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      background-color: #1e293b;
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
      display: block;
    }

    .event-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .event-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .event-card:hover img {
      transform: scale(1.08);
    }

    /* Gradiente e Textos sobre o Card */
    .event-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.1) 40%, rgba(15, 23, 42, 0.95) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    .event-date {
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .event-title {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .event-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 20px;
      align-self: flex-start;
    }
  </style>
</head>
<body>

  <header>
    <h1>📸 Nossas Galerias</h1>
    <p class="subtitle">Selecione um evento para visualizar as fotos e encontrar o seu rosto</p>
  </header>

  <main class="events-grid" id="eventsGrid"></main>

  <!-- Carrega a lista central de eventos -->
 <script src="./eventos.js?v=2"></script>
  <script>
    const eventsGrid = document.getElementById('eventsGrid');

    function renderEvents() {
      eventsGrid.innerHTML = '';

      EVENTOS.forEach(evento => {
        const card = document.createElement('a');
        card.className = 'event-card';
        // Redireciona para evento.html passando o ID do evento na URL
        card.href = `./evento.html?id=${encodeURIComponent(evento.id)}`;

        const totalAlbuns = evento.folders ? evento.folders.length : 1;

        card.innerHTML = `
          <img src="${evento.capa}" alt="${evento.nome}" loading="lazy">
          <div class="event-overlay">
            <span class="event-date">${evento.data}</span>
            <h2 class="event-title">${evento.nome}</h2>
            <span class="event-badge">📁 ${totalAlbuns} ${totalAlbuns > 1 ? 'álbuns' : 'álbum'}</span>
          </div>
        `;

        eventsGrid.appendChild(card);
      });
    }

    renderEvents();
  </script>
</body>
</html>

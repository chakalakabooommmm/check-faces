<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria Inteligente - Google Drive & Face AI</title>
  
  <!-- Face-API.js -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #3b82f6;
      color: #fff;
    }

    .btn-secondary {
      background-color: #334155;
      color: #fff;
    }

    .btn-success {
      background-color: #059669;
      color: #fff;
    }

    .btn-success:hover {
      background-color: #047857;
    }

    #statusMessage {
      font-size: 0.95rem;
      color: #94a3b8;
      min-height: 24px;
    }

    /* Abas */
    .tabs-wrapper {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      border-bottom: 1px solid #334155;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .tabs-bar {
      display: flex;
      gap: 10px;
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: #f8fafc;
      background-color: #1e293b;
    }

    .tab-btn.active {
      color: #fff;
      background-color: #2563eb;
    }

    .tab-btn.tab-matched {
      background-color: #059669;
      color: #fff;
    }

    /* Grid da Galeria */
    .gallery-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      background-color: #1e293b;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    .folder-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      color: #e2e8f0;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      font-size: 1.1rem;
    }

    /* Indicador do Scroll Infinito */
    #scrollLoader {
      max-width: 1200px;
      margin: 30px auto;
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
      display: none;
    }

    /* Modais */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      margin: 15px 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .face-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 210px;
      border: 2px dashed rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Lightbox */
    .lightbox-content {
      max-width: 85vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
    }

    .lightbox-actions {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .photo-counter {
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 2rem;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      z-index: 1010;
    }

    .nav-btn:hover {
      background: #2563eb;
      transform: translateY(-50%) scale(1.1);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .nav-btn-prev { left: 25px; }
    .nav-btn-next { right: 25px; }

    .btn-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1015;
      transition: background 0.2s;
    }

    .btn-close:hover {
      background: #ef4444;
    }

    @media (max-width: 768px) {
      .nav-btn {
        width: 42px;
        height: 42px;
        font-size: 1.4rem;
      }
      .nav-btn-prev { left: 10px; }
      .nav-btn-next { right: 10px; }
      .lightbox-content { max-width: 95vw; }
      .btn-close { top: 12px; right: 12px; width: 38px; height: 38px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>📸 Galeria Inteligente</h1>
    <div class="controls">
      <button class="btn btn-primary" id="btnScanFace" disabled>
        📷 Escanear meu Rosto em Todas as Pastas
      </button>
      <button class="btn btn-secondary" id="btnResetFilter" style="display: none;">
        Mostrar Todas as Fotos
      </button>
      <button class="btn btn-success" id="btnDownloadAllMatched" style="display: none;">
        📦 Baixar Todas as Minhas Fotos (.zip)
      </button>
    </div>
    <p id="statusMessage">Carregando galeria...</p>
  </header>

  <!-- Abas das Pastas -->
  <div class="tabs-wrapper">
    <div class="tabs-bar" id="tabsBar"></div>
  </div>

  <!-- Grade de Fotos -->
  <main class="gallery-grid" id="galleryGrid"></main>

  <!-- Elemento de Scroll Infinito -->
  <div id="scrollLoader">Carregando mais fotos...</div>

  <!-- Modal Câmera -->
  <div class="modal-overlay" id="cameraModal">
    <div class="modal-content">
      <button class="btn-close" id="btnCloseCamera">&times;</button>
      <h3>Alinhe seu rosto</h3>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">
        Olhe para a câmera e clique em buscar.
      </p>
      <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="face-guide"></div>
      </div>
      <button class="btn btn-primary" id="btnCaptureAndSearch" style="width: 100%; justify-content: center;">
        🔍 Procurar Meu Rosto em Tudo
      </button>
    </div>
  </div>

  <!-- Modal Lightbox -->
  <div class="modal-overlay" id="lightboxModal">
    <button class="btn-close" id="btnCloseLightbox" title="Fechar (Esc)">&times;</button>
    
    <button class="nav-btn nav-btn-prev" id="btnPrevPhoto" title="Foto Anterior (Seta Esquerda)">&#10094;</button>

    <div class="lightbox-content">
      <img id="lightboxImg" class="lightbox-img" src="" alt="Foto expandida">
      <div class="lightbox-actions">
        <a id="btnDownload" class="btn btn-primary" href="" target="_blank" download>
          ⬇ Baixar em Alta Resolução
        </a>
        <span class="photo-counter" id="photoCounter"></span>
      </div>
    </div>

    <button class="nav-btn nav-btn-next" id="btnNextPhoto" title="Próxima Foto (Seta Direita)">&#10095;</button>
  </div>

  <script>
    /* ====================================================================
       CONFIGURAÇÃO: COLOQUE SUA CHAVE E SUAS PASTAS AQUI
       ==================================================================== */
    const GOOGLE_API_KEY = 'AIzaSyCP2F0q6eyyFskTGj3jcjkhdfLP_11Wvz8';

    // Adicione quantas pastas quiser! Cada uma vira uma aba na tela.
    const FOLDERS = [
      { id: 'redcarpet',   name: 'Red Carpet',    folderId: '1h7mKXUEA6wsdD8Mf-3n7B9V-xfnM0Pg-' },
      { id: 'coquetel',  name: 'Coquetel',   folderId: '1jx6P6ZL852ti_0v3CIozJx4IjF98BQo9' },
      { id: 'exibição', name: 'Exibição', folderId: '1whd1ealZ21Yl_W1z3kw-n_pvCPY000pJ' }
    ];

    /* ====================================================================
       ESTADO DA APLICAÇÃO E ROLAGEM INFINITA
       ==================================================================== */
    const BATCH_SIZE = 30;           // Quantidade de fotos por bloco no scroll
    let renderedCount = 0;           // Quantas fotos já foram desenhadas na tela
    let allPhotos = [];
    let currentFilteredPhotos = [];
    let currentPhotoIndex = 0;
    const galleryDescriptors = new Map();
    let activeTabId = FOLDERS[0].id;
    let matchedPhotoIds = null;

    const tabsBar = document.getElementById('tabsBar');
    const galleryGrid = document.getElementById('galleryGrid');
    const scrollLoader = document.getElementById('scrollLoader');
    const statusMessage = document.getElementById('statusMessage');
    const btnScanFace = document.getElementById('btnScanFace');
    const btnResetFilter = document.getElementById('btnResetFilter');
    const btnDownloadAllMatched = document.getElementById('btnDownloadAllMatched');

    const cameraModal = document.getElementById('cameraModal');
    const webcam = document.getElementById('webcam');
    const btnCaptureAndSearch = document.getElementById('btnCaptureAndSearch');
    const btnCloseCamera = document.getElementById('btnCloseCamera');

    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const btnCloseLightbox = document.getElementById('btnCloseLightbox');
    const btnDownload = document.getElementById('btnDownload');
    const btnPrevPhoto = document.getElementById('btnPrevPhoto');
    const btnNextPhoto = document.getElementById('btnNextPhoto');
    const photoCounter = document.getElementById('photoCounter');

    let stream = null;

    // 1. Carregar fotos do Google Drive sem o limite de 100 fotos (com paginação)
    async function fetchPhotosFromDriveFolder(folder) {
      const query = encodeURIComponent(`'${folder.folderId}' in parents and mimeType contains 'image/' and trashed = false`);
      let allFiles = [];
      let pageToken = '';

      try {
        do {
          const pageParam = pageToken ? `&pageToken=${pageToken}` : '';
          const url = `https://www.googleapis.com/drive/v3/files?q=${query}&pageSize=1000&fields=nextPageToken,files(id,name)&key=${GOOGLE_API_KEY}${pageParam}`;

          const res = await fetch(url);
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);

          if (data.files) allFiles.push(...data.files);
          pageToken = data.nextPageToken; // Se houver mais de 1000 fotos, pega a próxima página
        } while (pageToken);

        return allFiles.map(file => ({
          id: file.id,
          name: file.name,
          folderId: folder.id,
          folderName: folder.name,
          thumbUrl: `https://lh3.googleusercontent.com/d/${file.id}=w400`,
          fullUrl: `https://lh3.googleusercontent.com/d/${file.id}=s0`,
          downloadUrl: `https://drive.google.com/uc?export=download&id=${file.id}`
        }));
      } catch (err) {
        console.error(`Erro na pasta "${folder.name}":`, err);
        return [];
      }
    }

    async function loadAllGalleries() {
      const promises = FOLDERS.map(f => fetchPhotosFromDriveFolder(f));
      const results = await Promise.all(promises);

      allPhotos = results.flat();

      if (allPhotos.length === 0) {
        statusMessage.textContent = 'Nenhuma foto encontrada nas pastas do Drive.';
        return false;
      }

      renderTabs();
      setupGalleryView();
      return true;
    }

    // 2. Abas
    function renderTabs() {
      tabsBar.innerHTML = '';

      if (matchedPhotoIds !== null) {
        const matchedBtn = document.createElement('button');
        matchedBtn.className = `tab-btn tab-matched ${activeTabId === 'matched' ? 'active' : ''}`;
        matchedBtn.innerHTML = `✨ Suas Fotos (${matchedPhotoIds.size})`;
        matchedBtn.onclick = () => {
          activeTabId = 'matched';
          renderTabs();
          setupGalleryView();
        };
        tabsBar.appendChild(matchedBtn);
      }

      FOLDERS.forEach(folder => {
        const total = allPhotos.filter(p => {
          const inFolder = p.folderId === folder.id;
          return matchedPhotoIds ? (inFolder && matchedPhotoIds.has(p.id)) : inFolder;
        }).length;

        const btn = document.createElement('button');
        btn.className = `tab-btn ${activeTabId === folder.id ? 'active' : ''}`;
        btn.innerHTML = `${folder.name} <span style="font-size: 0.8rem; opacity: 0.8;">(${total})</span>`;
        btn.onclick = () => {
          activeTabId = folder.id;
          renderTabs();
          setupGalleryView();
        };
        tabsBar.appendChild(btn);
      });
    }

    // 3. Configura a lista de fotos da aba e inicia a renderização com Scroll Infinito
    function setupGalleryView() {
      galleryGrid.innerHTML = '';
      renderedCount = 0;

      if (activeTabId === 'matched') {
        currentFilteredPhotos = allPhotos.filter(p => matchedPhotoIds.has(p.id));
      } else {
        currentFilteredPhotos = allPhotos.filter(p => {
          const matchFolder = p.folderId === activeTabId;
          return matchedPhotoIds ? (matchFolder && matchedPhotoIds.has(p.id)) : matchFolder;
        });
      }

      if (currentFilteredPhotos.length === 0) {
        galleryGrid.innerHTML = '<div class="empty-message">Nenhuma foto para exibir nesta aba.</div>';
        scrollLoader.style.display = 'none';
        return;
      }

      // Renderiza o primeiro bloco de fotos
      renderNextBatch();
    }

    // Adiciona o próximo bloco de fotos na grade
    function renderNextBatch() {
      if (renderedCount >= currentFilteredPhotos.length) {
        scrollLoader.style.display = 'none';
        return;
      }

      const nextBatch = currentFilteredPhotos.slice(renderedCount, renderedCount + BATCH_SIZE);

      nextBatch.forEach((photo, i) => {
        const globalIndex = renderedCount + i;
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `
          <img src="${photo.thumbUrl}" alt="${photo.name}" loading="lazy">
          ${activeTabId === 'matched' ? `<span class="folder-badge">${photo.folderName}</span>` : ''}
        `;
        item.onclick = () => openLightbox(globalIndex);
        galleryGrid.appendChild(item);
      });

      renderedCount += nextBatch.length;

      // Se ainda houver fotos restantes, mostra aviso de carregamento
      if (renderedCount < currentFilteredPhotos.length) {
        scrollLoader.style.display = 'block';
      } else {
        scrollLoader.style.display = 'none';
      }
    }

    // Detecta quando o usuário rolou até o fim da página
    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) {
        renderNextBatch();
      }
    });

    // 4. Lightbox com Navegação
    function openLightbox(index) {
      currentPhotoIndex = index;
      updateLightboxDisplay();
      lightboxModal.style.display = 'flex';
    }

    function updateLightboxDisplay() {
      if (currentFilteredPhotos.length === 0) return;

      const photo = currentFilteredPhotos[currentPhotoIndex];
      lightboxImg.src = photo.fullUrl;
      btnDownload.href = photo.downloadUrl;
      photoCounter.textContent = `${currentPhotoIndex + 1} de ${currentFilteredPhotos.length}`;
    }

    function showNextPhoto() {
      if (currentFilteredPhotos.length <= 1) return;
      currentPhotoIndex = (currentPhotoIndex + 1) % currentFilteredPhotos.length;
      updateLightboxDisplay();
    }

    function showPrevPhoto() {
      if (currentFilteredPhotos.length <= 1) return;
      currentPhotoIndex = (currentPhotoIndex - 1 + currentFilteredPhotos.length) % currentFilteredPhotos.length;
      updateLightboxDisplay();
    }

    function closeLightbox() {
      lightboxModal.style.display = 'none';
      lightboxImg.src = '';
    }

    btnNextPhoto.onclick = (e) => {
      e.stopPropagation();
      showNextPhoto();
    };

    btnPrevPhoto.onclick = (e) => {
      e.stopPropagation();
      showPrevPhoto();
    };

    btnCloseLightbox.onclick = closeLightbox;

    window.addEventListener('keydown', (e) => {
      if (lightboxModal.style.display === 'flex') {
        if (e.key === 'ArrowRight') showNextPhoto();
        if (e.key === 'ArrowLeft') showPrevPhoto();
        if (e.key === 'Escape') closeLightbox();
      }
    });

    // 5. Carregamento do faces.json
    async function initFaceAPI() {
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

      try {
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);

        const res = await fetch('./faces.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('faces.json não encontrado');

        const precomputedFaces = await res.json();
        const totalFotosIndexadas = Object.keys(precomputedFaces).length;

        for (const [photoId, descriptors] of Object.entries(precomputedFaces)) {
          galleryDescriptors.set(
            photoId,
            descriptors.map(d => new Float32Array(d))
          );
        }

        if (totalFotosIndexadas === 0) {
          statusMessage.textContent = 'Aviso: O robô ainda não mapeou as fotos no faces.json.';
        } else {
          statusMessage.textContent = `Pronto! ${totalFotosIndexadas} fotos prontas para escaneamento.`;
          btnScanFace.disabled = false;
        }
      } catch (err) {
        console.warn(err);
        statusMessage.textContent = 'faces.json vazio ou não encontrado. Rode o robô no GitHub Actions!';
      }
    }

    // 6. Câmera
    btnScanFace.onclick = async () => {
      cameraModal.style.display = 'flex';
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        webcam.srcObject = stream;
      } catch (err) {
        alert('Não foi possível acessar a câmera. Verifique as permissões.');
        cameraModal.style.display = 'none';
      }
    };

    function closeCameraModal() {
      cameraModal.style.display = 'none';
      if (stream) stream.getTracks().forEach(track => track.stop());
    }

    btnCloseCamera.onclick = closeCameraModal;

    // 7. Comparação e Reconhecimento
    btnCaptureAndSearch.onclick = async () => {
      btnCaptureAndSearch.disabled = true;
      btnCaptureAndSearch.textContent = 'Analisando seu rosto...';

      const detection = await faceapi.detectSingleFace(webcam).withFaceLandmarks().withFaceDescriptor();

      if (!detection) {
        alert('Rosto não identificado. Posicione-se com boa iluminação e olhe para a câmera.');
        btnCaptureAndSearch.disabled = false;
        btnCaptureAndSearch.textContent = '🔍 Procurar Meu Rosto em Tudo';
        return;
      }

      const userDescriptor = detection.descriptor;
      const foundIds = new Set();
      const DISTANCE_THRESHOLD = 0.55;

      allPhotos.forEach(photo => {
        const descriptors = galleryDescriptors.get(photo.id) || [];
        const hasMatch = descriptors.some(desc => {
          return faceapi.euclideanDistance(userDescriptor, desc) < DISTANCE_THRESHOLD;
        });

        if (hasMatch) foundIds.add(photo.id);
      });

      closeCameraModal();
      btnCaptureAndSearch.disabled = false;
      btnCaptureAndSearch.textContent = '🔍 Procurar Meu Rosto em Tudo';

      if (foundIds.size > 0) {
        matchedPhotoIds = foundIds;
        activeTabId = 'matched';
        renderTabs();
        setupGalleryView();
        statusMessage.textContent = `Sucesso! Encontramos ${foundIds.size} foto(s) onde você aparece.`;
        
        btnResetFilter.style.display = 'inline-block';
        btnDownloadAllMatched.style.display = 'inline-block';
        btnDownloadAllMatched.textContent = `📦 Baixar Todas as Minhas Fotos (${foundIds.size})`;
      } else {
        alert('Não encontramos nenhuma foto com o seu rosto.');
      }
    };

    // 8. Baixar Todas as Fotos Encontradas (.ZIP)
    btnDownloadAllMatched.onclick = async () => {
      if (!matchedPhotoIds || matchedPhotoIds.size === 0) return;

      const photosToDownload = allPhotos.filter(p => matchedPhotoIds.has(p.id));
      const total = photosToDownload.length;

      btnDownloadAllMatched.disabled = true;
      const originalText = btnDownloadAllMatched.textContent;

      try {
        const zip = new JSZip();
        let baixadas = 0;

        for (const photo of photosToDownload) {
          baixadas++;
          btnDownloadAllMatched.textContent = `Baixando ${baixadas}/${total}...`;

          try {
            const response = await fetch(photo.fullUrl);
            const blob = await response.blob();
            
            const extension = photo.name.includes('.') ? '' : '.jpg';
            const fileName = `${photo.folderName}_${photo.name}${extension}`;
            zip.file(fileName, blob);
          } catch (e) {
            console.warn(`Erro ao baixar: ${photo.name}`, e);
          }
        }

        btnDownloadAllMatched.textContent = 'Compactando arquivo .zip...';
        const zipBlob = await zip.generateAsync({ type: 'blob' });

        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipBlob);
        link.download = `minhas_fotos_galeria.zip`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);

        btnDownloadAllMatched.textContent = '✔ Download Concluído!';
        setTimeout(() => {
          btnDownloadAllMatched.textContent = originalText;
          btnDownloadAllMatched.disabled = false;
        }, 3000);

      } catch (err) {
        console.error(err);
        alert('Ocorreu um erro ao gerar o arquivo ZIP.');
        btnDownloadAllMatched.disabled = false;
        btnDownloadAllMatched.textContent = originalText;
      }
    };

    btnResetFilter.onclick = () => {
      matchedPhotoIds = null;
      activeTabId = FOLDERS[0].id;
      btnResetFilter.style.display = 'none';
      btnDownloadAllMatched.style.display = 'none';
      renderTabs();
      setupGalleryView();
      statusMessage.textContent = 'Exibindo todas as fotos.';
    };

    // Inicialização
    (async () => {
      const ok = await loadAllGalleries();
      if (ok) {
        await initFaceAPI();
      }
    })();
  </script>
</body>
</html>
